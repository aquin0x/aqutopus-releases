# Monomem Nginx Reverse Proxy Yapılandırması
# Alan adınız: monomem.frax.tr (veya kendi alan adınız)
#
# Let's Encrypt / Certbot ile SSL:
#   sudo certbot --nginx -d monomem.frax.tr

server {
    listen 80;
    listen [::]:80;
    server_name monomem.frax.tr;

    # Certbot ACME doğrulaması
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # HTTP -> HTTPS yönlendirmesi (SSL sertifikanız kurulduktan sonra açın)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # 1. Sohbet Uygulaması (Next.js - Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Ofis Yönetim Paneli ve API (Core - Port 8788)
    location /office/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
